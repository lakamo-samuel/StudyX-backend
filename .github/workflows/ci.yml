name: CI 
on: 
    push:
      branches:
        - main
    pull_request:
      branches:  
        - main 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install Dependencies
      run: npm install
    - name: Type Check
      run: npm run build
    
    

  